<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reporte de Usuario</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 40px;
            background: #fff;
            color: #333;
        }
        .container { max-width: 900px; margin: 0 auto; }
        .header-institucional {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            border-bottom: 3px solid #1a3a5c;
            padding-bottom: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }
        .header-institucional .logo-img {
            max-height: 70px;
            width: auto;
            display: block;
        }
        .header-institucional .textos-derecha {
            text-align: right;
            line-height: 1.3;
        }
        .header-institucional .textos-derecha .humanismo {
            display: block;
            font-size: 16px;
            font-weight: 700;
            color: #1a3a5c;
            letter-spacing: 1px;
        }
        .header-institucional .textos-derecha .secret {
            display: block;
            font-size: 22px;
            font-weight: 800;
            color: #b8860b;
        }
        .header-institucional .textos-derecha .gobierno-periodo {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #1a3a5c;
        }
        .no-print { text-align: right; margin-bottom: 20px; }
        .btn-imprimir {
            background: #1a3a5c;
            color: #fff;
            padding: 10px 25px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            text-decoration: none;
            display: inline-block;
        }
        .btn-imprimir:hover { background: #0f2a44; }
        .btn-volver {
            background: #6c757d;
            color: #fff;
            padding: 10px 25px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            text-decoration: none;
            display: inline-block;
        }
        .btn-volver:hover { background: #5a6268; }
        .info-usuario {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 25px;
            border-left: 4px solid #1a3a5c;
        }
        .info-usuario p { margin: 5px 0; font-size: 15px; }
        .resumen-tarjetas {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        .tarjeta {
            background: #f8f9fa;
            padding: 15px 30px;
            border-radius: 10px;
            text-align: center;
            min-width: 120px;
        }
        .tarjeta h2 { font-size: 32px; margin: 0; }
        .tarjeta p { margin: 5px 0 0; font-size: 14px; color: #666; }
        .total-blue h2 { color: #1a3a5c; }
        .justi-green h2 { color: #28a745; }
        .sin-justi-red h2 { color: #dc3545; }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            font-size: 14px;
        }
        thead {
            background: #6c8ae0;
            color: #fff;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        .badge {
            display: inline-block;
            padding: 3px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        .badge-justificada { background: #d4edda; color: #155724; }
        .badge-sin-justificar { background: #f8d7da; color: #721c24; }
        .footer-pagina {
            margin-top: 40px;
            text-align: center;
            font-size: 12px;
            color: #999;
            border-top: 1px solid #eee;
            padding-top: 20px;
        }
        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #1a3a5c;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .cargando { text-align: center; padding: 40px; color: #999; }
        .alert-danger {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: 500;
            font-size: 14px;
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        @media print {
            body { padding: 0.5cm; }
            .no-print { display: none !important; }
            .header-institucional { border-bottom-color: #000; }
            thead { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            .tarjeta, .badge { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
        }
    </style>
</head>
<body>
    <div class="container" id="contenido">
        <div class="cargando">
            <span class="spinner"></span> Cargando reporte...
        </div>
    </div>

    <script src="js/firebase-config.js"></script>
    <script src="js/firebase-app.js"></script>
    
    <script>
        let usuarioId = null, usuario = null, faltas = [];

        function escapeHtml(texto) {
            if (!texto) return '';
            const div = document.createElement('div');
            div.textContent = texto;
            return div.innerHTML;
        }

        function formatearFecha(fecha) {
            if (!fecha) return '--';
            const d = new Date(fecha);
            return d.toLocaleDateString('es-MX', { day: '2-digit', month: '2-digit', year: 'numeric' });
        }

        function formatearFechaHora(fecha) {
            if (!fecha) return '--';
            const d = new Date(fecha);
            return d.toLocaleString('es-MX', {
                day: '2-digit',
                month: '2-digit',
                year: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        function mostrarError(mensaje) {
            const div = document.getElementById('contenido');
            div.innerHTML = `
                <div class="alert-danger">❌ ${mensaje}</div>
                <a href="index.html" class="btn-volver">⬅ Volver al inicio</a>
            `;
        }

        async function cargarDatos() {
            const usuarioStr = localStorage.getItem('sg_usuario_actual');
            if (!usuarioStr) {
                window.location.href = 'login.html';
                return;
            }

            const params = new URLSearchParams(window.location.search);
            usuarioId = params.get('id') || params.get('uid');

            if (!usuarioId) {
                mostrarError('ID de usuario no válido');
                return;
            }

            const resultadoUser = await window.firebaseApp.obtenerUsuarioPorIdFirebase(usuarioId);
            if (!resultadoUser.success) {
                mostrarError('Usuario no encontrado');
                return;
            }
            usuario = resultadoUser.data;

            const resultadoFaltas = await window.firebaseApp.obtenerFaltasFirebase(usuarioId);
            if (resultadoFaltas.success) {
                faltas = resultadoFaltas.data;
            }

            renderizarReporte();
        }

        function renderizarReporte() {
            const div = document.getElementById('contenido');

            const totalFaltas = faltas.length;
            const justificadas = faltas.filter(f => f.justificada).length;
            const sinJustificar = totalFaltas - justificadas;

            let tablaHtml = '';
            if (faltas.length > 0) {
                tablaHtml = `
                    <table>
                        <thead><tr><th>#</th><th>Fecha</th><th>Motivo</th><th>Estado</th></tr></thead>
                        <tbody>
                `;
                faltas.forEach((falta, index) => {
                    const estaJustificada = falta.justificada || false;
                    const badgeClass = estaJustificada ? 'badge-justificada' : 'badge-sin-justificar';
                    const estadoTexto = estaJustificada ? '✅ Justificada' : '❌ Sin justificar';
                    tablaHtml += `
                        <tr>
                            <td>${index + 1}</td>
                            <td>${formatearFecha(falta.fecha_falta)}</td>
                            <td>${escapeHtml(falta.motivo || 'Sin motivo')}</td>
                            <td><span class="badge ${badgeClass}">${estadoTexto}</span></td>
                        </tr>
                    `;
                });
                tablaHtml += `</tbody></table>`;
            } else {
                tablaHtml = `<p style="text-align: center; padding: 20px; color: #999;">Este usuario no tiene faltas registradas.</p>`;
            }

            div.innerHTML = `
                <div class="no-print">
                    <button onclick="window.print()" class="btn-imprimir">🖨️ Imprimir Reporte</button>
                    <a href="index.html" class="btn-volver">⬅ Volver</a>
                </div>

                <div class="header-institucional">
                    <img src="logos/logo_izquierdo.jpg" alt="Logotipo Secretaría de Finanzas" class="logo-img" onerror="this.style.display='none'">
                    <div class="textos-derecha">
                        <span class="humanismo">HUMANISMO QUE TRANSFORMA</span>
                        <span class="secret">SECRETARÍA DE FINANZAS</span>
                        <span class="gobierno-periodo">GOBIERNO DE CHIAPAS 2024 - 2030</span>
                    </div>
                </div>

                <h1 style="text-align: center; color: #6c8ae0; margin-bottom: 10px;">📄 REPORTE DE USUARIO</h1>
                <p style="text-align: center; color: #666; margin-bottom: 30px;">Sistema de Gestión de Usuarios y Faltas</p>

                <div class="info-usuario">
                    <p><strong>👤 Nombre:</strong> ${escapeHtml(usuario.nombre || '')}</p>
                    <p><strong>📧 Email:</strong> ${escapeHtml(usuario.email || '')}</p>
                    <p><strong>📱 Teléfono:</strong> ${escapeHtml(usuario.telefono || '')}</p>
                    <p><strong>📅 Fecha de registro:</strong> ${formatearFechaHora(usuario.fecha_registro)}</p>
                </div>

                <h3 style="color: #1a3a5c; border-bottom: 2px solid #eee; padding-bottom: 10px;">📊 Resumen de Faltas</h3>
                <div class="resumen-tarjetas">
                    <div class="tarjeta total-blue"><h2>${totalFaltas}</h2><p>Total Faltas</p></div>
                    <div class="tarjeta justi-green"><h2>${justificadas}</h2><p>✅ Justificadas</p></div>
                    <div class="tarjeta sin-justi-red"><h2>${sinJustificar}</h2><p>❌ Sin Justificar</p></div>
                </div>

                <h3 style="color: #1a3a5c; border-bottom: 2px solid #eee; padding-bottom: 10px;">📜 Historial de Faltas</h3>
                ${tablaHtml}

                <div class="footer-pagina">
                    <p>Reporte generado el ${formatearFechaHora(new Date())}</p>
                    <p style="font-size: 11px;">Este documento es válido como constancia del historial del usuario</p>
                </div>
            `;
        }

        document.addEventListener('DOMContentLoaded', cargarDatos);
    </script>
</body>
</html>
