<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>Iniciar Sesión</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0d1b2a, #1a3a5c, #2c5f7c);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            margin: 0;
        }
        .login-container {
            background: #fff;
            border-radius: 16px;
            padding: clamp(25px, 5vw, 45px) clamp(20px, 4vw, 40px);
            max-width: 450px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
        }
        .login-container .logo-login {
            text-align: center;
            margin-bottom: 15px;
        }
        .login-container .logo-login img {
            height: clamp(60px, 12vw, 90px);
            width: auto;
            display: block;
            margin: 0 auto;
        }
        .login-container h1 {
            color: #1a3a5c;
            text-align: center;
            margin-bottom: 10px;
            font-size: clamp(22px, 4vw, 30px);
        }
        .login-container .subtitle {
            text-align: center;
            color: #6c757d;
            margin-bottom: 25px;
            font-size: clamp(13px, 1.8vw, 16px);
        }
        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            font-weight: 600;
            color: #333;
            margin-bottom: 6px;
            font-size: clamp(13px, 1.4vw, 15px);
        }
        .form-group input {
            width: 100%;
            padding: clamp(12px, 2vw, 16px) 15px;
            border: 2px solid #e0e4ea;
            border-radius: 8px;
            font-size: clamp(14px, 1.6vw, 17px);
            box-sizing: border-box;
            transition: all 0.3s;
            -webkit-appearance: none;
        }
        .form-group input:focus {
            border-color: #1a3a5c;
            outline: none;
            box-shadow: 0 0 0 4px rgba(26,58,92,0.1);
        }
        .btn-login {
            width: 100%;
            padding: clamp(14px, 2.2vw, 18px);
            background: linear-gradient(135deg, #1a3a5c, #2c5f7c);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: clamp(16px, 1.8vw, 19px);
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(26,58,92,0.3);
        }
        .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .alert {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: 500;
            font-size: clamp(13px, 1.4vw, 15px);
        }
        .alert-danger { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .alert-success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .footer-links {
            text-align: center;
            margin-top: 20px;
            font-size: clamp(13px, 1.4vw, 15px);
            color: #6c757d;
        }
        .footer-links a { color: #1a3a5c; text-decoration: none; font-weight: 600; }
        .footer {
            text-align: center;
            margin-top: 20px;
            font-size: clamp(11px, 1.2vw, 13px);
            color: #999;
            border-top: 1px solid #eee;
            padding-top: 20px;
        }
        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid #fff;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        @media (max-width: 480px) { .login-container { padding: 20px 15px; } .form-group input { font-size: 16px; } }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo-login">
            <img src="logos/logo_izquierdo.jpg" alt="Logotipo" onerror="this.style.display='none'">
        </div>
        <h1>🔐 Iniciar Sesión</h1>
        <p class="subtitle">Ingresa tus credenciales para acceder al sistema</p>
        <div id="mensaje"></div>
        <form id="loginForm">
            <div class="form-group">
                <label>👤 Usuario</label>
                <input type="text" id="nombre" placeholder="Ej: Administrador" required>
            </div>
            <div class="form-group">
                <label>🔒 Contraseña</label>
                <input type="password" id="contrasena" placeholder="Ingresa tu contraseña" required>
            </div>
            <button type="submit" class="btn-login" id="btnLogin">🚀 Iniciar Sesión</button>
        </form>
        <div class="footer-links">
            ¿No tienes cuenta? <a href="registro.html">Regístrate aquí</a>
        </div>
        <div class="footer">Sistema de Gestión - Secretaría de Finanzas de Chiapas</div>
    </div>

    <script src="js/firebase-config.js"></script>
    <script src="js/firebase-app.js"></script>
    
    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const nombre = document.getElementById('nombre').value.trim();
            const contrasena = document.getElementById('contrasena').value.trim();
            const btn = document.getElementById('btnLogin');
            const mensajeDiv = document.getElementById('mensaje');
            
            if (!nombre || !contrasena) {
                mostrarMensaje('Todos los campos son obligatorios.', 'danger');
                return;
            }
            
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span> Iniciando sesión...';
            mensajeDiv.innerHTML = '';
            
            try {
                const usuariosResult = await window.firebaseApp.obtenerUsuariosFirebase();
                
                if (!usuariosResult.success || !usuariosResult.data || usuariosResult.data.length === 0) {
                    mostrarMensaje('❌ No hay usuarios registrados.', 'danger');
                    btn.disabled = false;
                    btn.innerHTML = '🚀 Iniciar Sesión';
                    return;
                }
                
                const usuario = usuariosResult.data.find(u => {
                    const nombreMatch = u.nombre && u.nombre.toLowerCase().trim() === nombre.toLowerCase().trim();
                    const emailMatch = u.email && u.email.toLowerCase().trim() === nombre.toLowerCase().trim();
                    return nombreMatch || emailMatch;
                });
                
                if (!usuario) {
                    mostrarMensaje(`❌ Usuario "${nombre}" no encontrado.`, 'danger');
                    btn.disabled = false;
                    btn.innerHTML = '🚀 Iniciar Sesión';
                    return;
                }
                
                const usuarioGuardar = {
                    uid: usuario.uid,
                    nombre: usuario.nombre,
                    email: usuario.email || 'usuario@email.com',
                    rol: usuario.rol || 'usuario',
                    telefono: usuario.telefono || '',
                    area: usuario.area || '',
                    puesto: usuario.puesto || ''
                };
                
                localStorage.setItem('sg_usuario_actual', JSON.stringify(usuarioGuardar));
                
                mostrarMensaje(`✅ ¡Bienvenido ${usuario.nombre}!`, 'success');
                btn.innerHTML = '✅ ¡Bienvenido!';
                
                window.location.href = 'menu.html';
                
            } catch (error) {
                console.error('❌ Error:', error);
                mostrarMensaje('❌ Error inesperado: ' + error.message, 'danger');
                btn.disabled = false;
                btn.innerHTML = '🚀 Iniciar Sesión';
            }
        });

        function mostrarMensaje(texto, tipo) {
            const div = document.getElementById('mensaje');
            div.innerHTML = `<div class="alert alert-${tipo}">${texto}</div>`;
            setTimeout(() => { div.innerHTML = ''; }, 5000);
        }
    </script>
</body>
</html>
