<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>Gestión de Usuario</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        /* TODOS LOS ESTILOS QUE YA TENÍAS, MANTENLOS IGUAL */
        /* ... (tus estilos existentes) ... */
        
        /* AGREGAR ESTE ESTILO PARA EL BOTÓN CONEXIONES */
        .btn-conexiones {
            background: linear-gradient(135deg, #6f42c1 0%, #8b5cf6 100%);
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: clamp(9px, 1vw, 13px) clamp(16px, 2vw, 26px);
            font-size: clamp(12px, 1vw, 14px);
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: all 0.3s;
            text-align: center;
            box-shadow: 0 4px 12px rgba(111, 66, 193, 0.25);
        }
        .btn-conexiones:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(111, 66, 193, 0.35);
        }
        
        .oculto { display: none !important; }
    </style>
</head>
<body>
    <div class="container">
        <!-- HEADER SUPERIOR -->
        <div class="header-superior">
            <div class="logo-izquierda">
                <img src="logos/logo_izquierdo.jpg" alt="Logotipo" class="logo-img" onerror="this.style.display='none'">
                <div class="textos-logo">
                    <span class="humanismo">HUMANISMO QUE TRANSFORMA</span>
                    <span class="secret">SECRETARÍA DE FINANZAS</span>
                    <span class="gobierno">GOBIERNO DE CHIAPAS</span>
                    <span class="periodo">2024 - 2030</span>
                </div>
            </div>
            <div class="reloj-moderno" id="reloj">
                <span class="fecha" id="fecha">Cargando...</span>
                <span class="hora" id="hora">Cargando...</span>
            </div>
        </div>

        <!-- TÍTULO -->
        <div class="header-titulo">
            <span class="titulo-gestion">📊 Gestión de Usuario</span>
        </div>

        <!-- BOTONES -->
        <div class="header-actions">
            <div class="header-buttons no-print" id="botonesAccion">
                <!-- Los botones se cargan dinámicamente con JavaScript -->
            </div>
        </div>

        <!-- MENSAJES -->
        <div id="mensajeContainer"></div>

        <!-- BUSCADOR -->
        <div class="buscador-moderno no-print">
            <form id="buscarForm" style="display:flex; gap:10px; width:100%; justify-content:center; flex-wrap:wrap;">
                <input type="text" id="buscarInput" placeholder="🔍 Buscar por nombre o email...">
                <button type="submit" class="btn-buscar">Buscar</button>
                <button type="button" id="limpiarBuscar" class="btn-limpiar">✖ Limpiar</button>
            </form>
        </div>

        <!-- TABLA -->
        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th style="width:40px;">#</th>
                        <th>Nombre</th>
                        <th>Área</th>
                        <th>Puesto</th>
                        <th>Fecha Registro</th>
                        <th class="no-print" style="min-width:340px;">Acciones</th>
                    </tr>
                </thead>
                <tbody id="tablaBody">
                    <tr><td colspan="6" class="cargando"><span class="spinner"></span> Cargando usuarios...</td></tr>
                </tbody>
            </table>
        </div>

        <!-- VOLVER AL MENÚ -->
        <div style="text-align:left; margin-top:18px;" class="no-print">
            <a href="menu.html" class="btn-volver-menu">⬅ Volver al Menú</a>
        </div>
    </div>

    <script src="js/firebase-config.js"></script>
    <script src="js/firebase-app.js"></script>
    
    <script>
        let usuarioActual = null;
        let usuarios = [];

        function escapeHtml(texto) {
            if (!texto) return '';
            const div = document.createElement('div');
            div.textContent = texto;
            return div.innerHTML;
        }

        function mostrarMensaje(texto, tipo) {
            const container = document.getElementById('mensajeContainer');
            container.innerHTML = `
                <div class="alert alert-${tipo}">
                    ${texto}
                    <button class="close-btn" onclick="this.parentElement.style.display='none'">✕</button>
                </div>
            `;
            setTimeout(() => {
                const alert = container.querySelector('.alert');
                if (alert) alert.style.display = 'none';
            }, 5000);
        }

        function formatearFechaHora(fecha) {
            if (!fecha) return '--';
            const d = new Date(fecha);
            return d.toLocaleString('es-MX', {
                day: '2-digit',
                month: '2-digit',
                year: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        function actualizarReloj() {
            const ahora = new Date();
            const fecha = ahora.toLocaleDateString('es-MX', { year: 'numeric', month: '2-digit', day: '2-digit' });
            const hora = ahora.toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            document.getElementById('fecha').textContent = '📅 ' + fecha;
            document.getElementById('hora').textContent = '🕐 ' + hora;
        }
        setInterval(actualizarReloj, 1000);
        actualizarReloj();

        async function cargarDatos() {
            const usuarioStr = localStorage.getItem('sg_usuario_actual');
            if (!usuarioStr) {
                window.location.href = 'login.html';
                return;
            }
            usuarioActual = JSON.parse(usuarioStr);

            // ACTUALIZAR QUE EL USUARIO ESTÁ CONECTADO (CORRECCIÓN)
            try {
                await window.firebaseApp.actualizarUsuarioFirebase(usuarioActual.uid, {
                    conectado: true,
                    ultima_conexion: new Date().toISOString()
                });
            } catch (e) {
                console.error('Error actualizando estado de conexión:', e);
            }

            // Mostrar botones según rol
            const botonesDiv = document.getElementById('botonesAccion');
            const esAdmin = usuarioActual.rol === 'admin';

            if (esAdmin) {
                botonesDiv.innerHTML = `
                    <a href="agregar.html" class="btn btn-agregar">➕ Agregar Usuario</a>
                    <a href="imprimir_formato_blanco.html" target="_blank" class="btn btn-blanco">📄 Formato en Blanco</a>
                    <button onclick="window.print()" class="btn btn-imprimir">🖨️ Imprimir todo</button>
                    <a href="conexiones.html" class="btn-conexiones">🔗 Conexiones</a>
                `;
            } else {
                botonesDiv.innerHTML = `
                    <a href="imprimir_formato_blanco.html" target="_blank" class="btn btn-blanco">📄 Formato en Blanco</a>
                    <button onclick="window.print()" class="btn btn-imprimir">🖨️ Imprimir todo</button>
                `;
            }

            await cargarUsuarios();
        }

        async function cargarUsuarios() {
            const tbody = document.getElementById('tablaBody');
            tbody.innerHTML = `<tr><td colspan="6" class="cargando"><span class="spinner"></span> Cargando usuarios...</td></tr>`;

            const resultado = await window.firebaseApp.obtenerUsuariosFirebase();
            
            if (resultado.success) {
                usuarios = resultado.data;
                renderizarTabla(usuarios);
            } else {
                tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; padding:35px; color:#999;">❌ Error al cargar usuarios: ${resultado.error}</td></tr>`;
            }
        }

        function renderizarTabla(lista) {
            const tbody = document.getElementById('tablaBody');
            
            if (!lista || lista.length === 0) {
                tbody.innerHTML = `
                    <tr><td colspan="6" style="text-align: center; padding: 35px; color: #999;">📭 No hay usuarios registrados</td></tr>
                `;
                return;
            }

            let html = '';
            lista.forEach((usuario, index) => {
                const fechaRegistro = usuario.fecha_registro ? formatearFechaHora(usuario.fecha_registro) : '--';

                html += `
                    <tr>
                        <td data-label="#">${index + 1}</td>
                        <td data-label="Nombre"><strong>${escapeHtml(usuario.nombre)}</strong></td>
                        <td data-label="Área">${escapeHtml(usuario.area || '')}</td>
                        <td data-label="Puesto">${escapeHtml(usuario.puesto || '')}</td>
                        <td data-label="Fecha Registro" style="font-size: 13px; color: #555;">${fechaRegistro}</td>
                        <td data-label="Acciones" class="no-print">
                            <div class="acciones">
                                ${usuarioActual && usuarioActual.rol === 'admin' ? `
                                    <a href="editar.html?uid=${usuario.uid}" class="btn-small btn-editar">✏️ Editar</a>
                                    <button onclick="eliminarUsuario('${usuario.uid}')" class="btn-small btn-eliminar">🗑️ Eliminar</button>
                                ` : `
                                    <span class="sin-permisos">🔒 Sin permisos</span>
                                `}
                                <a href="faltas.html?usuario_id=${usuario.uid}" class="btn-small btn-faltas-small">📋 Faltas</a>
                                <a href="ver_incidencia.html?usuario_id=${usuario.uid}" class="btn-small btn-incidencias-small">📄 Incidencias</a>
                                <a href="imprimir_usuario.html?uid=${usuario.uid}" target="_blank" class="btn-small btn-imprimir-small">🖨️ Imprimir</a>
                            </div>
                        </td>
                    </tr>
                `;
            });

            tbody.innerHTML = html;
        }

        async function eliminarUsuario(uid) {
            if (!confirm('¿Estás seguro de eliminar este usuario?')) return;
            if (usuarioActual && usuarioActual.uid === uid) {
                mostrarMensaje('No puedes eliminar tu propio usuario.', 'danger');
                return;
            }
            const resultado = await window.firebaseApp.eliminarUsuarioFirebase(uid);
            if (resultado.success) {
                mostrarMensaje('Usuario eliminado correctamente.', 'success');
                await cargarUsuarios();
            } else {
                mostrarMensaje('❌ Error al eliminar: ' + resultado.error, 'danger');
            }
        }

        function buscarUsuarios(termino) {
            if (!termino.trim()) {
                renderizarTabla(usuarios);
                document.getElementById('limpiarBuscar').style.display = 'none';
                return;
            }
            const filtrados = usuarios.filter(u => 
                u.nombre.toLowerCase().includes(termino.toLowerCase())
            );
            renderizarTabla(filtrados);
            document.getElementById('limpiarBuscar').style.display = 'inline-block';
        }

        document.addEventListener('DOMContentLoaded', cargarDatos);

        document.getElementById('buscarForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const termino = document.getElementById('buscarInput').value;
            buscarUsuarios(termino);
        });

        document.getElementById('limpiarBuscar').addEventListener('click', function() {
            document.getElementById('buscarInput').value = '';
            buscarUsuarios('');
        });

        document.getElementById('buscarInput').addEventListener('input', function() {
            const termino = this.value;
            if (termino.length >= 2 || termino.length === 0) {
                buscarUsuarios(termino);
            }
        });

        (function() {
            const params = new URLSearchParams(window.location.search);
            const mensaje = params.get('mensaje');
            const error = params.get('error');
            if (mensaje) mostrarMensaje(mensaje, 'success');
            if (error) mostrarMensaje(error, 'danger');
        })();
    </script>
</body>
</html>
