<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>Registrar Incidencia</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f2f5;
            min-height: 100vh;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #fff;
            border-radius: 12px;
            padding: clamp(15px, 2.5vw, 30px);
            box-shadow: 0 8px 30px rgba(0,0,0,0.1);
        }
        .header-form {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            border-bottom: 3px solid #1a3a5c;
            padding-bottom: 15px;
            margin-bottom: 25px;
        }
        .header-form h2 { color:#1a3a5c; font-size: clamp(20px, 2.8vw, 28px); }
        .btn-volver {
            background:#6c757d; color:#fff; padding: clamp(8px, 1.2vw, 12px) clamp(15px, 2vw, 25px);
            border-radius:8px; text-decoration:none; font-weight:600; transition:all 0.3s;
            font-size: clamp(13px, 1.2vw, 15px); text-align:center;
        }
        .btn-volver:hover { background:#5a6268; transform:translateY(-2px); }
        @media (max-width: 768px) {
            .header-form { flex-direction: column; align-items: stretch; text-align: center; }
            .btn-volver { width: 100%; text-align: center; }
        }
        .perfil-usuario {
            background:#f8f9fa; border-radius:12px; padding:20px; margin-bottom:25px;
            border-left:5px solid #1a3a5c; display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:15px;
        }
        .perfil-usuario .campo { display:flex; flex-direction:column; }
        .perfil-usuario .campo label { font-size:clamp(11px, 1vw, 13px); font-weight:600; color:#6c757d; text-transform:uppercase; letter-spacing:0.5px; }
        .perfil-usuario .campo span { font-size:clamp(14px, 1.4vw, 18px); font-weight:600; color:#1a3a5c; margin-top:3px; }
        @media (max-width: 768px) { .perfil-usuario { grid-template-columns:1fr; } }

        .form-incidencia {
            background:#f8f9fa; border-radius:12px; padding:clamp(15px, 2vw, 25px); margin-top:20px; border:1px solid #e6eaef;
        }
        .form-incidencia h3 { color:#1a3a5c; margin-bottom:20px; padding-bottom:10px; border-bottom:2px solid #e6eaef; font-size:clamp(18px, 2vw, 22px); }
        .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:18px; }
        .form-grid .campo { display:flex; flex-direction:column; gap:5px; }
        .form-grid .campo.ancho-completo { grid-column:1/-1; }
        .form-grid label { font-weight:600; font-size:clamp(13px, 1.2vw, 15px); color:#2c3e50; }
        .form-grid label .obligatorio { color:#dc3545; }
        .form-grid input, .form-grid select, .form-grid textarea {
            padding:clamp(8px, 1.2vw, 12px) 12px;
            border:2px solid #dce1e8; border-radius:8px; font-size:clamp(13px, 1.2vw, 15px);
            transition:0.3s; font-family:inherit; width:100%; box-sizing:border-box;
        }
        .form-grid input:focus, .form-grid select:focus, .form-grid textarea:focus {
            border-color:#1a3a5c; outline:none; box-shadow:0 0 0 3px rgba(26,58,92,0.1);
        }
        .form-grid textarea { resize:vertical; min-height:80px; }
        @media (max-width: 768px) { .form-grid { grid-template-columns:1fr; } }

        .acciones-form {
            display:flex; gap:15px; margin-top:20px; justify-content:flex-end; flex-wrap:wrap;
        }
        .btn {
            padding:clamp(10px, 1.5vw, 14px) clamp(20px, 2.5vw, 35px);
            border:none; border-radius:8px; font-size:clamp(14px, 1.4vw, 17px);
            font-weight:600; cursor:pointer; text-decoration:none; display:inline-block; transition:all 0.3s; text-align:center;
        }
        .btn-guardar { background:#1a3a5c; color:#fff; }
        .btn-guardar:hover { background:#0f2a44; transform:translateY(-2px); box-shadow:0 5px 15px rgba(26,58,92,0.3); }
        .btn-guardar:disabled { opacity:0.6; cursor:not-allowed; }
        .btn-cancelar { background:#e9edf2; color:#3d4f62; }
        .btn-cancelar:hover { background:#d5dce6; }
        @media (max-width: 768px) {
            .acciones-form { flex-direction:column; }
            .btn { width:100%; text-align:center; }
        }
        .alert {
            padding:15px 20px; border-radius:8px; margin-bottom:20px; display:flex;
            justify-content:space-between; align-items:center; font-weight:500; flex-wrap:wrap; gap:10px;
        }
        .alert-success { background:#d4edda; color:#155724; border:1px solid #c3e6cb; }
        .alert-danger { background:#f8d7da; color:#721c24; border:1px solid #f5c6cb; }
        .close-btn { background:none; border:none; font-size:20px; cursor:pointer; color:inherit; opacity:0.7; }
        .spinner {
            display:inline-block; width:16px; height:16px; border:2px solid #fff;
            border-radius:50%; border-top-color:transparent; animation:spin 0.8s linear infinite;
            vertical-align:middle; margin-right:8px;
        }
        @keyframes spin { to { transform:rotate(360deg); } }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-form">
            <h2>📝 Registrar Nueva Incidencia</h2>
            <a href="ver_incidencia.html?usuario_id=" id="btnVolver" class="btn-volver">⬅ Volver</a>
        </div>
        <div class="perfil-usuario" id="perfilUsuario">
            <div class="campo"><label>👤 Nombre</label><span id="usuarioNombre">Cargando...</span></div>
            <div class="campo"><label>📧 Email</label><span id="usuarioEmail">Cargando...</span></div>
            <div class="campo"><label>🏢 Área</label><span id="usuarioArea">Cargando...</span></div>
            <div class="campo"><label>💼 Puesto</label><span id="usuarioPuesto">Cargando...</span></div>
        </div>
        <div id="mensajeContainer"></div>
        <div class="form-incidencia">
            <h3>📝 Registrar Nueva Incidencia</h3>
            <form id="formIncidencia">
                <div class="form-grid">
                    <div class="campo">
                        <label for="tipo">Tipo de Incidencia <span class="obligatorio">*</span></label>
                        <select id="tipo" required>
                            <option value="">Selecciona el tipo</option>
                            <option value="Vacaciones">🏖️ Vacaciones</option>
                            <option value="Comisión">📋 Comisión</option>
                            <option value="Permiso Económico">💰 Permiso Económico</option>
                            <option value="Omisión Entrada">⚠️ Omisión de Entrada</option>
                            <option value="Omisión Salida">⚠️ Omisión de Salida</option>
                            <option value="Cumpleaños Confianza">🎂 Cumpleaños Personal de Confianza</option>
                            <option value="Otra">📌 Otra</option>
                        </select>
                    </div>
                    <div class="campo">
                        <label for="fecha">Fecha de Inicio <span class="obligatorio">*</span></label>
                        <input type="date" id="fecha" required>
                    </div>
                    <div class="campo">
                        <label for="fecha_fin">Fecha de Fin</label>
                        <input type="date" id="fecha_fin">
                    </div>
                    <div class="campo">
                        <label for="dias">Días a Justificar</label>
                        <input type="number" id="dias" min="0.5" step="0.5" value="1">
                    </div>
                    <div class="campo ancho-completo">
                        <label for="motivo">Motivo de la Incidencia <span class="obligatorio">*</span></label>
                        <textarea id="motivo" rows="3" required placeholder="Describe detalladamente el motivo..."></textarea>
                    </div>
                    <div class="campo ancho-completo">
                        <label for="observaciones">Observaciones Adicionales</label>
                        <textarea id="observaciones" rows="2" placeholder="Comentarios adicionales (opcional)..."></textarea>
                    </div>
                </div>
                <div class="acciones-form">
                    <a href="#" id="btnCancelar" class="btn btn-cancelar">✕ Cancelar</a>
                    <button type="submit" class="btn btn-guardar" id="btnGuardar">💾 Registrar Incidencia</button>
                </div>
            </form>
        </div>
    </div>
    <script src="js/firebase-config.js"></script>
    <script src="js/firebase-app.js"></script>
    <script>
        let usuarioId=null;
        function mostrarMensaje(texto,tipo){
            const c=document.getElementById('mensajeContainer');
            c.innerHTML=`<div class="alert alert-${tipo}">${texto}<button class="close-btn" onclick="this.parentElement.style.display='none'">✕</button></div>`;
            setTimeout(()=>{ const a=c.querySelector('.alert'); if(a) a.style.display='none'; },5000);
        }
        async function init(){
            const u=localStorage.getItem('sg_usuario_actual');
            if(!u){ window.location.href='login.html'; return; }
            const p=new URLSearchParams(window.location.search);
            usuarioId=p.get('usuario_id');
            if(!usuarioId){ mostrarMensaje('Usuario no válido','danger'); return; }
            document.getElementById('btnVolver').href=`ver_incidencia.html?usuario_id=${usuarioId}`;
            document.getElementById('btnCancelar').href=`ver_incidencia.html?usuario_id=${usuarioId}`;
            const r=await window.firebaseApp.obtenerUsuarioPorIdFirebase(usuarioId);
            if(r.success){ const u2=r.data; document.getElementById('usuarioNombre').textContent=u2.nombre||'--'; document.getElementById('usuarioEmail').textContent=u2.email||'--'; document.getElementById('usuarioArea').textContent=u2.area||'--'; document.getElementById('usuarioPuesto').textContent=u2.puesto||'--'; }
            else { mostrarMensaje('Usuario no encontrado','danger'); return; }
            document.getElementById('fecha').value=new Date().toISOString().split('T')[0];
            document.getElementById('fecha').addEventListener('change',calcularDias);
            document.getElementById('fecha_fin').addEventListener('change',calcularDias);
        }
        function calcularDias(){ const inicio=document.getElementById('fecha').value, fin=document.getElementById('fecha_fin').value; if(inicio&&fin){ const d1=new Date(inicio),d2=new Date(fin),diff=Math.abs(d2-d1),dias=Math.ceil(diff/(1000*60*60*24))+1; document.getElementById('dias').value=dias; } }
        document.getElementById('formIncidencia').addEventListener('submit', async function(e){
            e.preventDefault();
            const tipo=document.getElementById('tipo').value, fecha=document.getElementById('fecha').value, fecha_fin=document.getElementById('fecha_fin').value, dias=document.getElementById('dias').value||0, motivo=document.getElementById('motivo').value.trim(), observaciones=document.getElementById('observaciones').value.trim(), btn=document.getElementById('btnGuardar');
            if(!tipo||!fecha||!motivo){ mostrarMensaje('Los campos Tipo, Fecha de Inicio y Motivo son obligatorios.','danger'); return; }
            btn.disabled=true; btn.innerHTML='<span class="spinner"></span> Guardando...';
            const r=await window.firebaseApp.agregarIncidenciaFirebase(usuarioId,{tipo_incidencia:tipo,fecha_inicio:fecha,fecha_fin:fecha_fin,dias:parseInt(dias),motivo:motivo,observaciones:observaciones});
            if(r.success){ mostrarMensaje('✅ Incidencia registrada.','success'); btn.innerHTML='✅ ¡Guardado!'; setTimeout(()=>{ window.location.href=`ver_incidencia.html?usuario_id=${usuarioId}&mensaje=Incidencia registrada`; },1500); }
            else { mostrarMensaje('❌ Error: '+r.error,'danger'); btn.disabled=false; btn.innerHTML='💾 Registrar Incidencia'; }
        });
        document.addEventListener('DOMContentLoaded',init);
    </script>
</body>
</html>
