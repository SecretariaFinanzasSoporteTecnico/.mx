<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>Agregar Usuario</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f2f5;
            min-height: 100vh;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            border-radius: 12px;
            padding: clamp(15px, 2.5vw, 30px);
            box-shadow: 0 8px 30px rgba(0,0,0,0.1);
        }
        .header-form {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            border-bottom: 3px solid #28a745;
            padding-bottom: 15px;
            margin-bottom: 25px;
        }
        .header-form .logo-header {
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }
        .header-form .logo-header img {
            height: clamp(40px, 6vw, 60px);
            width: auto;
        }
        .header-form h2 {
            color: #28a745;
            font-size: clamp(20px, 3vw, 28px);
        }
        .btn-volver {
            background: #6c757d;
            color: #fff;
            padding: clamp(8px, 1.2vw, 12px) clamp(15px, 2vw, 25px);
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s;
            font-size: clamp(13px, 1.2vw, 15px);
            text-align: center;
        }
        .btn-volver:hover { background: #5a6268; transform: translateY(-2px); }
        @media (max-width: 768px) {
            .header-form { flex-direction: column; align-items: stretch; text-align: center; }
            .btn-volver { width: 100%; text-align: center; }
        }
        .seccion-form {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 25px;
            border-left: 4px solid #28a745;
        }
        .seccion-form h4 {
            color: #333;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: clamp(16px, 1.8vw, 20px);
        }
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        @media (max-width: 768px) { .form-grid { grid-template-columns: 1fr; } }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .form-group label {
            font-weight: 600;
            color: #555;
            font-size: clamp(12px, 1.2vw, 14px);
        }
        .form-group label .required { color: #dc3545; }
        .form-group input {
            padding: clamp(10px, 1.5vw, 14px) 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: clamp(13px, 1.2vw, 15px);
            transition: all 0.3s;
            background: white;
            width: 100%;
            box-sizing: border-box;
        }
        .form-group input:focus {
            outline: none;
            border-color: #28a745;
            box-shadow: 0 0 0 3px rgba(40,167,69,0.2);
        }
        .form-actions {
            display: flex;
            gap: 15px;
            margin-top: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .btn {
            padding: clamp(10px, 1.5vw, 14px) clamp(20px, 2.5vw, 35px);
            border: none;
            border-radius: 8px;
            font-size: clamp(14px, 1.4vw, 17px);
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: all 0.3s;
            text-align: center;
        }
        .btn-guardar {
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
            color: #fff;
        }
        .btn-guardar:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(40,167,69,0.4); }
        .btn-guardar:disabled { opacity:0.6; cursor:not-allowed; }
        .btn-cancelar {
            background: #dc3545;
            color: #fff;
        }
        .btn-cancelar:hover { background: #c82333; transform: translateY(-2px); }
        @media (max-width: 768px) {
            .form-actions { flex-direction: column; }
            .btn { width: 100%; justify-content: center; }
        }
        .alert {
            padding: 12px 18px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: 500;
        }
        .alert-success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .alert-danger { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .close-btn { background: none; border: none; font-size: 20px; cursor: pointer; color: inherit; opacity: 0.7; }
        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #fff;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-form">
            <div class="logo-header">
                <img src="logos/logo_izquierdo.jpg" alt="Logotipo" onerror="this.style.display='none'">
                <h2>➕ Agregar Usuario</h2>
            </div>
            <a href="index.html" class="btn-volver">⬅ Volver</a>
        </div>
        <div id="mensajeContainer"></div>
        <form id="formUsuario">
            <div class="seccion-form">
                <h4>👤 Datos Personales</h4>
                <div class="form-grid">
                    <div class="form-group">
                        <label>Nombre completo <span class="required">*</span></label>
                        <input type="text" id="nombre" required>
                    </div>
                    <div class="form-group">
                        <label>Correo electrónico <span class="required">*</span></label>
                        <input type="email" id="email" required>
                    </div>
                    <div class="form-group">
                        <label>Contraseña <span class="required">*</span></label>
                        <input type="password" id="contrasena" placeholder="Mínimo 6 caracteres" required minlength="6">
                    </div>
                    <div class="form-group">
                        <label>Teléfono / Extensión</label>
                        <input type="text" id="telefono">
                    </div>
                    <div class="form-group">
                        <label>Área</label>
                        <input type="text" id="area">
                    </div>
                    <div class="form-group">
                        <label>Puesto</label>
                        <input type="text" id="puesto">
                    </div>
                    <div class="form-group">
                        <label>NIP</label>
                        <input type="text" id="nip">
                    </div>
                </div>
            </div>
            <div class="form-actions">
                <a href="index.html" class="btn btn-cancelar">✕ Cancelar</a>
                <button type="submit" class="btn btn-guardar" id="btnGuardar">💾 Guardar Usuario</button>
            </div>
        </form>
    </div>
    <script src="js/firebase-config.js"></script>
    <script src="js/firebase-app.js"></script>
    <script>
        function mostrarMensaje(texto,tipo){
            const c=document.getElementById('mensajeContainer');
            c.innerHTML=`<div class="alert alert-${tipo}">${texto}<button class="close-btn" onclick="this.parentElement.style.display='none'">✕</button></div>`;
            setTimeout(()=>{ const a=c.querySelector('.alert'); if(a) a.style.display='none'; },5000);
        }
        document.getElementById('formUsuario').addEventListener('submit', async function(e){
            e.preventDefault();
            const nombre=document.getElementById('nombre').value.trim();
            const email=document.getElementById('email').value.trim();
            const contrasena=document.getElementById('contrasena').value;
            const telefono=document.getElementById('telefono').value.trim();
            const area=document.getElementById('area').value.trim();
            const puesto=document.getElementById('puesto').value.trim();
            const nip=document.getElementById('nip').value.trim();
            const btn=document.getElementById('btnGuardar');
            if(!nombre||!email||!contrasena){ mostrarMensaje('Nombre, email y contraseña son obligatorios.','danger'); return; }
            if(contrasena.length<6){ mostrarMensaje('La contraseña debe tener al menos 6 caracteres.','danger'); return; }
            btn.disabled=true; btn.innerHTML='<span class="spinner"></span> Guardando...';
            const r=await window.firebaseApp.registrarFirebase(email,contrasena,{nombre,telefono,area,puesto,nip,rol:'usuario'});
            if(r.success){ mostrarMensaje('✅ Usuario creado correctamente.','success'); btn.innerHTML='✅ ¡Guardado!'; setTimeout(()=>{ window.location.href='index.html?mensaje=Usuario agregado'; },1500); }
            else { mostrarMensaje('❌ '+r.error,'danger'); btn.disabled=false; btn.innerHTML='💾 Guardar Usuario'; }
        });
    </script>
</body>
</html>
