<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>Registro de Usuario</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0d1b2a, #1a3a5c, #2c5f7c);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            margin: 0;
        }
        .registro-container {
            background: #fff;
            border-radius: 16px;
            padding: clamp(25px, 5vw, 45px) clamp(20px, 4vw, 40px);
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
        }
        .registro-container .logo-registro {
            text-align: center;
            margin-bottom: 15px;
        }
        .registro-container .logo-registro img {
            height: clamp(60px, 12vw, 90px);
            width: auto;
            display: block;
            margin: 0 auto;
        }
        .registro-container h1 {
            color: #1a3a5c;
            text-align: center;
            margin-bottom: 10px;
            font-size: clamp(22px, 4vw, 30px);
        }
        .registro-container .subtitle {
            text-align: center;
            color: #6c757d;
            margin-bottom: 25px;
            font-size: clamp(13px, 1.8vw, 16px);
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
            font-size: clamp(13px, 1.4vw, 15px);
        }
        .form-group label .required { color: #dc3545; }
        .form-group input {
            width: 100%;
            padding: clamp(10px, 1.8vw, 14px) 15px;
            border: 2px solid #e0e4ea;
            border-radius: 8px;
            font-size: clamp(14px, 1.6vw, 17px);
            box-sizing: border-box;
            transition: all 0.3s;
            -webkit-appearance: none;
        }
        .form-group input:focus {
            border-color: #1a3a5c;
            outline: none;
            box-shadow: 0 0 0 4px rgba(26,58,92,0.1);
        }
        .btn-registro {
            width: 100%;
            padding: clamp(14px, 2.2vw, 18px);
            background: linear-gradient(135deg, #28a745, #20c997);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: clamp(16px, 1.8vw, 19px);
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-registro:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(40,167,69,0.3);
        }
        .btn-registro:disabled { opacity: 0.6; cursor: not-allowed; }
        .alert {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: 500;
            font-size: clamp(13px, 1.4vw, 15px);
        }
        .alert-danger { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .alert-success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .footer-links {
            text-align: center;
            margin-top: 20px;
            font-size: clamp(13px, 1.4vw, 15px);
            color: #6c757d;
        }
        .footer-links a { color: #1a3a5c; text-decoration: none; font-weight: 600; }
        .footer {
            text-align: center;
            margin-top: 20px;
            font-size: clamp(11px, 1.2vw, 13px);
            color: #999;
            border-top: 1px solid #eee;
            padding-top: 20px;
        }
        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid #fff;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .info-ayuda {
            background: #e7f3ff;
            padding: 12px 18px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
            margin-top: 15px;
            color: #333;
            font-size: clamp(12px, 1.2vw, 14px);
        }
        .info-ayuda strong { color: #667eea; }
        @media (max-width: 480px) { .registro-container { padding: 20px 15px; } .form-group input { font-size: 16px; } }
    </style>
</head>
<body>
    <div class="registro-container">
        <div class="logo-registro">
            <img src="logos/logo_izquierdo.jpg" alt="Logotipo" onerror="this.style.display='none'">
        </div>
        <h1>📝 Crear Cuenta</h1>
        <p class="subtitle">Regístrate para acceder al sistema</p>
        <div id="mensaje"></div>
        <form id="registroForm">
            <div class="form-group">
                <label>👤 Usuario <span class="required">*</span></label>
                <input type="text" id="nombre" placeholder="Ej: Juan Pérez" required>
            </div>
            <div class="form-group">
                <label>🔒 Contraseña <span class="required">*</span></label>
                <input type="password" id="contrasena" placeholder="Mínimo 6 caracteres" required minlength="6">
            </div>
            <div class="form-group">
                <label>🔒 Confirmar Contraseña <span class="required">*</span></label>
                <input type="password" id="confirmar_contrasena" placeholder="Repite tu contraseña" required>
            </div>
            <button type="submit" class="btn-registro" id="btnRegistro">✅ Registrarse</button>
        </form>
        <div class="footer-links">
            ¿Ya tienes cuenta? <a href="login.html">Iniciar Sesión</a>
        </div>
        <div class="info-ayuda">
            <strong>ℹ️ Información:</strong> Los campos marcados con <strong>*</strong> son obligatorios.
        </div>
        <div class="footer">Sistema de Gestión - Secretaría de Finanzas de Chiapas</div>
    </div>

    <script src="js/firebase-config.js"></script>
    <script src="js/firebase-app.js"></script>
    
    <script>
        document.getElementById('registroForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const nombre = document.getElementById('nombre').value.trim();
            const contrasena = document.getElementById('contrasena').value;
            const confirmar = document.getElementById('confirmar_contrasena').value;
            const btn = document.getElementById('btnRegistro');
            const mensajeDiv = document.getElementById('mensaje');
            
            if (!nombre || !contrasena || !confirmar) {
                mostrarMensaje('Todos los campos marcados con * son obligatorios.', 'danger');
                return;
            }
            if (contrasena.length < 6) {
                mostrarMensaje('La contraseña debe tener al menos 6 caracteres.', 'danger');
                return;
            }
            if (contrasena !== confirmar) {
                mostrarMensaje('Las contraseñas no coinciden.', 'danger');
                return;
            }
            
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span> Registrando...';
            mensajeDiv.innerHTML = '';
            
            const email = nombre
                .toLowerCase()
                .normalize('NFD')
                .replace(/[\u0300-\u036f]/g, '')
                .replace(/\s/g, '')
                + '@sistema.com';
            
            console.log('📧 Email generado internamente:', email);
            
            const datosUsuario = { 
                nombre: nombre,
                telefono: '',
                rol: 'usuario'
            };
            
            try {
                const resultado = await window.firebaseApp.registrarFirebase(email, contrasena, datosUsuario);
                
                if (resultado.success) {
                    mostrarMensaje('✅ ¡Cuenta creada exitosamente!', 'success');
                    btn.innerHTML = '✅ ¡Registrado!';
                    setTimeout(() => { 
                        window.location.href = 'login.html?mensaje=Cuenta creada exitosamente'; 
                    }, 2000);
                } else {
                    mostrarMensaje('❌ ' + resultado.error, 'danger');
                    btn.disabled = false;
                    btn.innerHTML = '✅ Registrarse';
                }
            } catch (error) {
                console.error('❌ Error completo:', error);
                mostrarMensaje('❌ Error: ' + error.message, 'danger');
                btn.disabled = false;
                btn.innerHTML = '✅ Registrarse';
            }
        });

        function mostrarMensaje(texto, tipo) {
            const div = document.getElementById('mensaje');
            div.innerHTML = `<div class="alert alert-${tipo}">${texto}</div>`;
            setTimeout(() => { div.innerHTML = ''; }, 6000);
        }
    </script>
</body>
</html>
